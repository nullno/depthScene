[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depthscene"
version = "0.3.0"
description = "单目深度视觉避障：深度估计 + 开放词表检测 + 扇区避障"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
export = ["ultralytics>=8.3", "onnx", "onnxslim"]
gpu = ["onnxruntime-directml; platform_system == 'Windows'"]
dev = ["ruff"]

[project.scripts]
depthscene = "depthscene.cli:main"

[tool.setuptools]
packages = ["depthscene"]

[tool.setuptools.package-data]
depthscene = ["web/*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
